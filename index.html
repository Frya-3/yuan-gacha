<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>代号鸢 · 密探招募录</title>

  <!-- iOS 主屏幕专属 App 配置 -->
  <meta name="apple-mobile-web-app-title" content="密探招募录">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="apple-touch-icon" id="appleTouchIcon" href="">
  <link rel="apple-touch-icon-precomposed" id="appleTouchIconPre" href="">
  <link rel="icon" id="pageFavicon" type="image/png" href="">

  <style>
    :root {
      /* 芭乐夏日主题调色盘 */
      --color-guava-blush:  #FDD7D0; 
      --color-peel-citron:  #EAE7B4; 
      --color-flesh-sorbet: #F19E96; 
      --color-guava-saga:   #B2BA69; 
      --color-fruit-pulp:   #F8ECD7; 

      --bg-body: #FDF9F3;
      --card-bg: #FFFFFF;
      --text-main: #46382E;
      --text-sub: #8D7B6F;
      --border-color: #EFE4D6;
      
      --accent-gold: var(--color-flesh-sorbet);
      --accent-gold-bg: #FFF3F1;
      --accent-red: #D9534F;
      --accent-red-bg: #FDF2F2;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-soft: 0 4px 18px rgba(178, 186, 105, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      background-color: var(--bg-body); 
      color: var(--text-main); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; 
      line-height: 1.5; 
      padding-bottom: 120px; 
    }

    /* 顶部导航 Tabs */
    .nav-tabs { 
      position: sticky; top: 0; z-index: 20; display: flex; 
      background: rgba(253, 249, 243, 0.95); 
      backdrop-filter: blur(10px); 
      padding: 12px 16px; 
      border-bottom: 1px solid var(--border-color); 
      gap: 12px; 
    }
    .nav-tab-btn { 
      flex: 1; padding: 10px 0; text-align: center; border: 1px solid transparent; 
      background: rgba(248, 236, 215, 0.5); 
      color: var(--text-sub); font-size: 14px; font-weight: 600; 
      border-radius: var(--radius-md); cursor: pointer; 
      transition: all 0.2s ease;
    }
    .nav-tab-btn.active { 
      background: var(--card-bg); 
      color: var(--text-main); 
      border-color: var(--color-guava-blush); 
      box-shadow: 0 4px 12px rgba(241, 158, 150, 0.18); 
    }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    /* 画廊顶部栏 */
    .gallery-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .gallery-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .btn-create-pool-pill {
      background: var(--color-peel-citron);
      color: var(--text-main);
      border: 1px solid rgba(178, 186, 105, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 卡池流展示卡片 */
    .pool-card-stream { display: flex; flex-direction: column; gap: 14px; }
    .pool-stream-item {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
      overflow: hidden; display: flex; flex-direction: column;
      transition: all 0.2s ease;
    }

    .stream-poster-container {
      width: 100%; background: #FAF3E8; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      max-height: 260px; position: relative; cursor: pointer;
    }
    .stream-poster-container img {
      width: 100%; height: 100%; max-height: 260px; object-fit: contain; display: block;
    }
    .stream-poster-placeholder {
      padding: 32px 0; text-align: center; font-size: 12px; color: var(--text-sub); line-height: 1.6;
    }

    .stream-item-info {
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
    }
    .stream-info-left {
      display: flex; flex-direction: column; gap: 4px; overflow: hidden; padding-right: 8px;
    }
    .stream-title-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .stream-pool-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .stream-pool-meta { font-size: 12px; color: var(--text-sub); }
    .stream-info-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stream-pull-badge {
      font-size: 13px; font-weight: 700; color: var(--color-flesh-sorbet);
      background: var(--accent-gold-bg); padding: 4px 10px; border-radius: 12px;
      border: 1px solid var(--color-guava-blush);
    }
    .stream-fold-arrow { font-size: 11px; color: var(--text-sub); transition: transform 0.2s ease; }
    .pool-stream-item.expanded .stream-fold-arrow { transform: rotate(180deg); }

    /* 气泡包裹类目标签样式 */
    .bubble-category-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      line-height: 1.3;
      letter-spacing: 0.2px;
      border: 1px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-限定       { background: #FFF0EE; color: var(--color-flesh-sorbet); border-color: var(--color-guava-blush); }
    .cat-自选限定   { background: #F6F3DF; color: #7B8528; border-color: var(--color-peel-citron); }
    .cat-复刻       { background: #F2F0ED; color: #73675E; border-color: #E2DBD3; }
    .cat-照影       { background: #E8F7F3; color: #32967F; border-color: #C3ECE1; }
    .cat-刘辩地宫   { background: #FFF4F2; color: #D65A5A; border-color: #FEDAD6; }
    .cat-傅融地宫   { background: #F3F5FC; color: #4F6BA8; border-color: #D8E0F7; }
    .cat-袁基地宫   { background: #F4F8F1; color: #538A4B; border-color: #D3E8CC; }
    .cat-左慈地宫   { background: #FBF4FD; color: #8F55A8; border-color: #EED7F7; }
    .cat-孙策地宫   { background: #FEF7EC; color: #C27429; border-color: #F8DFC0; }

    /* ==================== 核心新特性：密探展开区及卡片调优 ==================== */
    .stream-expanded-content {
      display: none;
      padding: 14px 16px 18px 16px;
      background: #FDFBFA;
      border-top: 1px dashed var(--border-color);
    }
    .pool-stream-item.expanded .stream-expanded-content {
      display: block;
    }

    .expanded-pool-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(239, 228, 214, 0.6);
    }
    .expanded-stat-text {
      font-size: 11px;
      color: var(--text-sub);
    }
    .expanded-stat-text b { color: var(--color-guava-saga); font-weight: 700; }
    .btn-pool-edit-inline {
      background: none;
      border: none;
      font-size: 11px;
      color: var(--color-guava-saga);
      font-weight: 700;
      cursor: pointer;
    }

    /* 5 列响应式网格布局 (间距放大至 11px) */
    .chars-grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 11px; /* 间距由 8px 扩大到 11px */
    }

    /* 3:4 比例精致密探卡 */
    .mini-char-card-wrap {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 8px; /* 圆角稍微圆润一点更贴合卡片质感 */
      overflow: hidden;
      background: var(--color-fruit-pulp);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(70, 56, 46, 0.06);
    }
    .mini-char-card-wrap.rarity-SSR {
      border: 1.8px solid var(--color-flesh-sorbet);
      box-shadow: 0 3px 10px rgba(241, 158, 150, 0.35);
    }
    .mini-char-card-wrap.is-lost {
      border: 1.8px solid var(--accent-red) !important;
    }

    .mini-char-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .mini-char-fallback {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* 底部半透明黑底抽数标注 (加大加厚加高) */
    .mini-pulls-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(3px);
      color: #FFFFFF;
      font-size: 11.5px; /* 由 10px 放大至 11.5px */
      font-weight: 800;
      text-align: center;
      padding: 3px 0; /* 内边距加高 */
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.2px;
    }
    .mini-char-card-wrap.rarity-SSR .mini-pulls-label {
      color: #FFF2A8; /* 更鲜亮的浅亮金 */
    }
    .mini-char-card-wrap.is-lost .mini-pulls-label {
      color: #FFB3B3;
    }

    /* 右上角「歪」红色微标 (加大至 18px，带清晰白边与阴影) */
    .mini-lost-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      background: var(--accent-red);
      color: #FFFFFF;
      font-size: 10px; /* 字体加大 */
      font-weight: 900;
      width: 18px; /* 由 14px 扩大至 18px */
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #FFFFFF; /* 加一圈干净的白色描边防混色 */
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
      z-index: 3;
    }

    .empty-grid-notice {
      grid-column: span 5;
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 统计卡片与网格 */
    .stat-card { 
      background: var(--card-bg); border-radius: var(--radius-lg); 
      padding: 16px; margin-bottom: 14px; 
      box-shadow: var(--shadow-soft); border: 1px solid var(--border-color); 
    }
    .stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .stat-title { font-size: 14px; font-weight: 700; color: var(--text-main); }
    
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-item { 
      background: #FDF9F3; 
      padding: 9px 8px; border-radius: var(--radius-sm); text-align: center; 
      border: 1px solid #FAF0E4;
    }
    .stat-val { font-size: 16px; font-weight: 700; color: var(--text-main); display: block; }
    .stat-item.highlight .stat-val { color: var(--color-guava-saga); }
    .stat-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; display: block; }

    /* 普池记录列表 */
    .record-list { display: flex; flex-direction: column; gap: 10px; }
    .record-item { 
      display: flex; align-items: center; background: var(--card-bg); 
      padding: 12px 14px; border-radius: var(--radius-md); 
      box-shadow: 0 3px 12px rgba(70, 56, 46, 0.04); 
      border: 1px solid var(--border-color); 
      border-left: 5px solid #D8CFC4; position: relative; 
    }
    .record-item.rarity-SSR { border-left-color: var(--color-flesh-sorbet); }
    .char-card-box { 
      width: 44px; aspect-ratio: 3 / 4; border-radius: 6px; 
      background: var(--color-fruit-pulp); display: flex; align-items: center; justify-content: center; 
      font-size: 14px; font-weight: 700; color: var(--text-sub); margin-right: 12px; 
      flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-color); 
    }
    .char-card-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .record-info { flex: 1; overflow: hidden; }
    .info-top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .char-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
    .tag-up { background: var(--color-flesh-sorbet); color: #FFF; }
    .info-sub { font-size: 12px; color: var(--text-sub); }
    .record-actions { display: flex; align-items: center; gap: 8px; }
    .pull-count { font-size: 16px; font-weight: 700; color: var(--text-sub); text-align: right; }
    .record-item.rarity-SSR .pull-count { color: var(--color-flesh-sorbet); }
    .btn-edit-record, .btn-del-record { background: transparent; border: none; font-size: 16px; padding: 4px 6px; cursor: pointer; color: var(--text-sub); }
    .btn-del-record { color: #C5BCB3; }

    /* 底部操作 */
    .bottom-bar { margin-top: 24px; padding-top: 14px; border-top: 1px dashed var(--border-color); display: flex; gap: 10px; }
    .btn-action-tool { 
      flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); 
      padding: 8px 0; border-radius: var(--radius-sm); font-size: 12px; color: var(--text-sub); cursor: pointer; 
    }

    /* 悬浮加号 */
    .fab { 
      position: fixed; right: 20px; bottom: 28px; width: 56px; height: 56px; 
      border-radius: 50%; background: var(--color-flesh-sorbet); color: #FFFFFF; 
      display: flex; align-items: center; justify-content: center; font-size: 32px; 
      border: none; box-shadow: 0 8px 24px rgba(241, 158, 150, 0.45); 
      cursor: pointer; z-index: 99; 
    }

    /* 弹窗面板 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(70, 56, 46, 0.45); z-index: 1000; display: none; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .modal-panel { background: var(--card-bg); width: 100%; border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px 20px 36px 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; color: var(--text-main); }
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .form-input, .form-select { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: #FAF6F0; font-size: 15px; color: var(--text-main); outline: none; }
    
    .chips-selector-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px 2px; scrollbar-width: none;
    }
    .chips-selector-scroll::-webkit-scrollbar { display: none; }
    .chip-bubble-opt {
      flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: 1px solid var(--border-color);
      background: #FAF6F0; color: var(--text-sub); transition: all 0.2s ease;
    }
    .chip-bubble-opt.selected {
      background: var(--color-flesh-sorbet); color: #FFFFFF; border-color: var(--color-flesh-sorbet);
      box-shadow: 0 3px 10px rgba(241, 158, 150, 0.35);
    }

    .date-range-picker-row { display: flex; align-items: center; gap: 8px; }
    .date-input-mini {
      flex: 1; padding: 10px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
      background: #FAF6F0; font-size: 13px; color: var(--text-main); outline: none; font-family: inherit;
    }
    .date-split-text { font-size: 12px; color: var(--text-sub); flex-shrink: 0; }

    .segmented-control { display: flex; gap: 8px; }
    .segment-opt { 
      flex: 1; padding: 9px 0; text-align: center; border: 1px solid var(--border-color); 
      border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; background: #FAF6F0; color: var(--text-sub); 
    }
    .segment-opt.selected { 
      background: var(--color-flesh-sorbet); color: #FFF; border-color: var(--color-flesh-sorbet); font-weight: 600; 
    }
    
    .btn-submit { 
      width: 100%; padding: 13px; background: var(--color-flesh-sorbet); color: #FFF; 
      border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; 
      margin-top: 10px; cursor: pointer; box-shadow: 0 4px 14px rgba(241, 158, 150, 0.3);
    }

    .avatar-uploader-row { display: flex; align-items: center; gap: 14px; background: #FAF6F0; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px dashed var(--color-guava-blush); }
    .preview-box-3-4 { width: 51px; aspect-ratio: 3 / 4; border-radius: 6px; background: var(--color-fruit-pulp); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border-color); color: var(--text-sub); font-size: 11px; }
    .preview-box-3-4 img { width: 100%; height: 100%; object-fit: cover; }
    .uploader-actions { display: flex; flex-direction: column; gap: 5px; }
    .btn-upload-fake { background: var(--color-guava-blush); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; cursor: pointer; text-align: center; }
    .btn-clear-photo { background: none; border: none; color: var(--accent-red); font-size: 11px; cursor: pointer; text-align: left; display: none; }
  </style>
</head>
<body>

  <!-- 顶部主池切换 -->
  <header class="nav-tabs">
    <div class="nav-tab-btn active" id="tabStandardBtn" onclick="window.switchMainPool('standard')">绣衣楼密招 (普池)</div>
    <div class="nav-tab-btn" id="tabLimitedBtn" onclick="window.switchMainPool('limited')">限定特命 (活动池)</div>
  </header>

  <main class="container">

    <!-- ==================== 1. 普池视图 ==================== -->
    <section id="standardMainView">
      <div class="stat-card">
        <div class="stat-header"><div class="stat-title">普池招募表现</div></div>
        <div class="stat-grid">
          <div class="stat-item"><span class="stat-val" id="stdTotalPulls">0</span><span class="stat-label">总招募步数</span></div>
          <div class="stat-item"><span class="stat-val" id="stdSsrPulls">0</span><span class="stat-label">绝密总数</span></div>
          <div class="stat-item"><span class="stat-val" id="stdAvgPulls">0.0</span><span class="stat-label">绝密平均抽数</span></div>
          <div class="stat-item highlight"><span class="stat-val" id="stdPityRate">0.0%</span><span class="stat-label">历史硬保底率 (≥40抽)</span></div>
        </div>
      </div>
      <div class="record-list" id="standardRecordList"></div>
    </section>

    <!-- ==================== 2. 限定特命界面 (画卷主界面 + 展开五列密探矩阵) ==================== -->
    <section id="limitedMainView" style="display: none;">
      
      <div class="stat-card">
        <div class="stat-header"><div class="stat-title">限定总体宏观表现 (全部池)</div></div>
        <div class="stat-grid">
          <div class="stat-item"><span class="stat-val" id="lmtTotalPulls">0</span><span class="stat-label">总招募步数</span></div>
          <div class="stat-item"><span class="stat-val" id="lmtSsrPulls">0</span><span class="stat-label">绝密总数</span></div>
          <div class="stat-item"><span class="stat-val" id="lmtAvgPulls">0.0</span><span class="stat-label">绝密平均抽数</span></div>
          <div class="stat-item"><span class="stat-val" id="lmtUpPulls">0</span><span class="stat-label">UP绝密数</span></div>
          <div class="stat-item highlight"><span class="stat-val" id="lmtWinRate">0.0%</span><span class="stat-label">小保底不歪率</span></div>
          <div class="stat-item highlight"><span class="stat-val" id="lmtPityRate">0.0%</span><span class="stat-label">历史硬保底率 (≥40抽)</span></div>
        </div>
      </div>

      <div class="gallery-top-bar">
        <span class="gallery-title">限定卡池画卷 (轻触卡池展开密探)</span>
        <button class="btn-create-pool-pill" onclick="window.openCreatePoolModal()">+ 开辟新池</button>
      </div>

      <!-- 主界面卡池流展示容器 -->
      <div class="pool-card-stream" id="poolCardStreamContainer"></div>

    </section>

    <!-- 隐藏的海报上传 Input -->
    <input type="file" id="bannerFileInput" accept="image/*" style="display: none;" onchange="window.handleBannerUpload(event)">

    <!-- 底部操作栏 -->
    <footer class="bottom-bar">
      <button class="btn-action-tool" onclick="window.exportDataJSON()">导出备份</button>
      <button class="btn-action-tool" onclick="window.triggerImportJSON()">导入备份</button>
      <button class="btn-action-tool" onclick="window.clearCurrentPoolData()">清空数据</button>
      <input type="file" id="jsonFileInput" style="display: none;" accept=".json" onchange="window.importDataJSON(event)" />
    </footer>
  </main>

  <!-- 浮动登记入口按钮 -->
  <button class="fab" onclick="window.openAddModal()">+</button>

  <!-- 模态框 1：新建 / 编辑卡池 -->
  <div class="modal-overlay" id="createPoolModal" onclick="window.closeModalOnBg(event)">
    <div class="modal-panel" onclick="event.stopPropagation()">
      <div class="modal-title" id="poolModalTitle">开辟新限定卡池</div>
      <input type="hidden" id="editingPoolOriginalName" value="">
      
      <div class="form-group">
        <label class="form-label">卡池名录 (四字名)</label>

      function parseDateToISO(str) {
        if (!str) return '';
        const cleaned = str.trim().replace(/\./g, '-').replace(/\//g, '-');
        const parts = cleaned.split('-');
        if (parts.length === 3) {
          const y = parts[0].padStart(4, '20');
          const m = parts[1].padStart(2, '0');
          const d = parts[2].padStart(2, '0');
          return `${y}-${m}-${d}`;
        } else if (parts.length === 2) {
          const m = parts[0].padStart(2, '0');
          const d = parts[1].padStart(2, '0');
          return `2024-${m}-${d}`;
        }
        return '';
      }

      function getPoolStartTimestamp(dateRange) {
        if (!dateRange || dateRange === '未定' || dateRange === '历史活动') return 0;
        const firstPart = dateRange.split('-')[0].trim().replace('起', '').trim();
        const iso = parseDateToISO(firstPart);
        if (!iso) return 0;
        const time = new Date(iso).getTime();
        return isNaN(time) ? 0 : time;
      }

      function sortPoolsChronologically() {
        if (!appData.pools) return;
        appData.pools.sort((a, b) => {
          const timeA = getPoolStartTimestamp(a.dateRange);
          const timeB = getPoolStartTimestamp(b.dateRange);
          return timeB - timeA;
        });
      }

      function reconcilePools() {
        if (!appData.pools) appData.pools = [];

        if (appData.limited && appData.limited.length > 0) {
          appData.limited.forEach(rec => {
            if (rec.poolName && NAME_ALIASES[rec.poolName]) {
              rec.poolName = NAME_ALIASES[rec.poolName];
            }
          });
        }
        if (appData.poolBanners) {
          Object.keys(NAME_ALIASES).forEach(oldKey => {
            if (appData.poolBanners[oldKey]) {
              appData.poolBanners[NAME_ALIASES[oldKey]] = appData.poolBanners[oldKey];
              delete appData.poolBanners[oldKey];
            }
          });
        }

        BLACKLIST_POOLS.forEach(badPool => {
          delete appData.poolBanners[badPool];
          appData.pools = appData.pools.filter(p => p.name !== badPool);
        });

        appData.pools.forEach(p => {
          if (NAME_ALIASES[p.name]) {
            p.name = NAME_ALIASES[p.name];
          } else if (p.name.endsWith('复刻') && p.name.length > 4) {
            p.name = p.name.replace('复刻', '');
          }
        });

        const uniquePools = [];
        appData.pools.forEach(p => {
          if (!BLACKLIST_POOLS.includes(p.name) && !uniquePools.some(u => u.name === p.name)) {
            uniquePools.push(p);
          }
        });
        appData.pools = uniquePools;

        MASTER_PRESET_POOLS.forEach(pre => {
          const existing = appData.pools.find(p => p.name === pre.name);
          if (!existing) {
            appData.pools.push(pre);
          } else {
            existing.category = pre.category;
            existing.dateRange = pre.dateRange;
            existing.upChars = pre.upChars;
          }
        });

        sortPoolsChronologically();
      }

      function loadData() {
        return new Promise((resolve) => {
          const tx = dbInstance.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get('root_data');

          req.onsuccess = function() {
            if (req.result) {
              appData = req.result;
              reconcilePools();
              saveData().then(resolve);
            } else {
              appData.pools = [...MASTER_PRESET_POOLS];
              sortPoolsChronologically();
              saveData().then(resolve);
            }
          };
          req.onerror = function() { resolve(); };
        });
      }

      function saveData() {
        return new Promise((resolve) => {
          if (!dbInstance) return resolve();
          sortPoolsChronologically();
          const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put(appData, 'root_data');
          tx.oncomplete = function() {
            render();
            resolve();
          };
        });
      }

      function compressAdaptiveImage(file, maxDimension, quality, callback) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let w = img.width;
            let h = img.height;

            if (w > h) {
              if (w > maxDimension) {
                h = Math.round(h * (maxDimension / w));
                w = maxDimension;
              }
            } else {
              if (h > maxDimension) {
                w = Math.round(w * (maxDimension / h));
                h = maxDimension;
              }
            }

            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }

      function cropAvatar34(file, callback) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const targetW = 120;
            const targetH = 160;
            canvas.width = targetW;
            canvas.height = targetH;

            let srcW = img.width;
            let srcH = img.height;
            let sx = 0, sy = 0;
            const targetRatio = 3 / 4;
            const srcRatio = srcW / srcH;

            if (srcRatio > targetRatio) {
              const newSrcW = srcH * targetRatio;
              sx = (srcW - newSrcW) / 2;
              srcW = newSrcW;
            } else {
              const newSrcH = srcW / targetRatio;
              sy = (srcH - newSrcH) / 2;
              srcH = newSrcH;
            }

            ctx.drawImage(img, sx, sy, srcW, srcH, 0, 0, targetW, targetH);
            callback(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }

      window.triggerUploadBanner = function(poolName) {
        uploadTargetPoolName = poolName;
        document.getElementById('bannerFileInput').click();
      };

      window.handleBannerUpload = function(e) {
        const file = e.target.files[0];
        if (!file || !uploadTargetPoolName) return;
        compressAdaptiveImage(file, 720, 0.82, function(base64) {
          appData.poolBanners[uploadTargetPoolName] = base64;
          saveData();
        });
        e.target.value = '';
      };

      window.removePoolBannerByName = function(poolName) {
        if (confirm(`确认移除卡池「${poolName}」的海报？`)) {
          delete appData.poolBanners[poolName];
          saveData();
        }
      };

      window.handleAvatarSelect = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        cropAvatar34(file, function(base64) {
          currentAvatarBase64 = base64;
          const previewBox = document.getElementById('avatarPreviewBox');
          previewBox.innerHTML = `<img src="${currentAvatarBase64}">`;
          document.getElementById('btnClearAvatar').style.display = 'inline-block';
        });
        e.target.value = '';
      };

      window.clearAvatarPreview = function() {
        currentAvatarBase64 = '';
        document.getElementById('avatarPreviewBox').innerHTML = '3:4 无像';
        document.getElementById('btnClearAvatar').style.display = 'none';
      };

      window.switchMainPool = function(tab) {
        activeTab = tab;
        document.getElementById('tabStandardBtn').classList.toggle('active', tab === 'standard');
        document.getElementById('tabLimitedBtn').classList.toggle('active', tab === 'limited');
        document.getElementById('standardMainView').style.display = (tab === 'standard') ? 'block' : 'none';
        document.getElementById('limitedMainView').style.display = (tab === 'limited') ? 'block' : 'none';
        render();
      };

      window.togglePoolExpand = function(poolName) {
        if (expandedPoolNames.has(poolName)) {
          expandedPoolNames.delete(poolName);
        } else {
          expandedPoolNames.add(poolName);
        }
        render();
      };

      function getCategoryBubbleHtml(cat) {
        const c = cat || "限定";
        return `<span class="bubble-category-tag cat-${c}">${c}</span>`;
      }

      /* 渲染主界面卡池画卷与五个一排的密探流 (微调升级后的间距与微标) */
      function renderPoolCardStream() {
        const streamContainer = document.getElementById('poolCardStreamContainer');
        streamContainer.innerHTML = '';

        appData.pools.forEach(pool => {
          const isExpanded = expandedPoolNames.has(pool.name);
          const item = document.createElement('div');
          item.className = `pool-stream-item ${isExpanded ? 'expanded' : ''}`;

          const bannerData = appData.poolBanners[pool.name];
          const bannerHtml = bannerData 
            ? `<img src="${bannerData}" alt="${pool.name}">` 
            : `<div class="stream-poster-placeholder">📷 点击导入海报<br><span style="font-size:11px; color:#A49488;">(自动适配 9:16 竖版或 16:9 横版)</span></div>`;

          const poolRecords = appData.limited.filter(r => r.poolName === pool.name);
          poolRecords.sort((a, b) => b.timestamp - a.timestamp);
          const poolPulls = poolRecords.reduce((acc, r) => acc + Number(r.pulls), 0);

          let charsGridHtml = '';
          if (poolRecords.length === 0) {
            charsGridHtml = '<div class="empty-grid-notice">该卡池暂无密探出仕记录</div>';
          } else {
            charsGridHtml = poolRecords.map(rec => {
              const isSsr = rec.rarity === '绝密';
              const isLost = isSsr && !rec.isUp;
              const avatarHtml = rec.avatar 
                ? `<img class="mini-char-img" src="${rec.avatar}" alt="${rec.name}">` 
                : `<span class="mini-char-fallback">${rec.name.slice(0, 1)}</span>`;

              return `
                <div class="mini-char-card-wrap ${isSsr ? 'rarity-SSR' : ''} ${isLost ? 'is-lost' : ''}" 
                     title="${rec.name} (${rec.pulls}抽)"
                     onclick="event.stopPropagation(); window.openEditModal('${rec.id}')">
                  ${isLost ? '<div class="mini-lost-badge">歪</div>' : ''}
                  ${avatarHtml}
                  <div class="mini-pulls-label">${rec.pulls}抽</div>
                </div>
              `;
            }).join('');
          }

          item.innerHTML = `
            <div class="stream-poster-container" onclick="event.stopPropagation(); window.triggerUploadBanner('${pool.name}')">
              ${bannerHtml}
            </div>

            <div class="stream-item-info" onclick="window.togglePoolExpand('${pool.name}')">
              <div class="stream-info-left">
                <div class="stream-title-row">
                  <span class="stream-pool-name">${pool.name}</span>
                  ${getCategoryBubbleHtml(pool.category)}
                </div>
                <span class="stream-pool-meta">周期: ${pool.dateRange || '未定'}</span>
                <span class="stream-pool-meta">UP: ${pool.upChars || '未设'}</span>
              </div>
              <div class="stream-info-right">
                <span class="stream-pull-badge">${poolPulls} 抽</span>
                <span class="stream-fold-arrow">▼</span>
              </div>
            </div>

            <div class="stream-expanded-content">
              <div class="expanded-pool-tools">
                <div class="expanded-stat-text">共 <b>${poolRecords.length}</b> 位密探 · 点击卡片修改/换图</div>
                <div style="display:flex; gap:10px;">
                  <button class="btn-pool-edit-inline" onclick="event.stopPropagation(); window.openEditPoolModalByName('${pool.name}')">✎ 编辑卡池</button>
                  ${bannerData ? `<button class="btn-pool-edit-inline" style="color:var(--accent-red);" onclick="event.stopPropagation(); window.removePoolBannerByName('${pool.name}')">移除海报</button>` : ''}
                </div>
              </div>
              <div class="chars-grid-5">
                ${charsGridHtml}
              </div>
            </div>
          `;
          streamContainer.appendChild(item);
        });
      }

      function render() {
        if (activeTab === 'standard') {
          renderStandardView();
        } else {
          renderLimitedView();
        }
      }

      function renderStandardView() {
        const total = appData.standard.reduce((acc, r) => acc + Number(r.pulls), 0);
        const ssrList = appData.standard.filter(r => r.rarity === '绝密');
        const ssrCount = ssrList.length;
        const pityCount = ssrList.filter(r => Number(r.pulls) >= 40).length;
        const pityRate = ssrCount > 0 ? ((pityCount / ssrCount) * 100).toFixed(1) + '%' : '0.0%';

        document.getElementById('stdTotalPulls').innerText = total;
        document.getElementById('stdSsrPulls').innerText = ssrCount;
        document.getElementById('stdAvgPulls').innerText = ssrCount > 0 ? (total / ssrCount).toFixed(1) : '0.0';
        document.getElementById('stdPityRate').innerText = pityRate;

        renderRecordList('standardRecordList', appData.standard);
      }

      function renderLimitedView() {
        const allTotal = appData.limited.reduce((acc, r) => acc + Number(r.pulls), 0);
        const allSsr = appData.limited.filter(r => r.rarity === '绝密');
        const allSsrCount = allSsr.length;
        const allUpCount = allSsr.filter(r => r.isUp).length;
        const allPityCount = allSsr.filter(r => Number(r.pulls) >= 40).length;

        document.getElementById('lmtTotalPulls').innerText = allTotal;
        document.getElementById('lmtSsrPulls').innerText = allSsrCount;
        document.getElementById('lmtAvgPulls').innerText = allSsrCount > 0 ? (allTotal / allSsrCount).toFixed(1) : '0.0';
        document.getElementById('lmtUpPulls').innerText = allUpCount;
        document.getElementById('lmtWinRate').innerText = allSsrCount > 0 ? ((allUpCount / allSsrCount) * 100).toFixed(1) + '%' : '0.0%';
        document.getElementById('lmtPityRate').innerText = allSsrCount > 0 ? ((allPityCount / allSsrCount) * 100).toFixed(1) + '%' : '0.0%';

        renderPoolCardStream();
      }

      function renderRecordList(containerId, rawList) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        let list = [...rawList];
        list.sort((a, b) => b.timestamp - a.timestamp);

        if (list.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:30px 0; font-size:12px; color:var(--text-sub);">暂无密探出仕记录</div>';
          return;
        }

        list.forEach(function(item) {
          const node = document.createElement('div');
          const isSsr = item.rarity === '绝密';
          node.className = 'record-item ' + (isSsr ? 'rarity-SSR ' : ' ');
          const avatarHtml = item.avatar ? `<img src="${item.avatar}">` : (item.name.slice(0, 1) || '秘');

          node.innerHTML = `
            <div class="char-card-box">${avatarHtml}</div>
            <div class="record-info">
              <div class="info-top"><span class="char-name">${item.name}</span></div>
              <div class="info-sub">${item.rarity}</div>
            </div>
            <div class="record-actions">
              <div class="pull-count">${item.pulls} 抽</div>
              <button class="btn-edit-record" title="修改" onclick="window.openEditModal('${item.id}')">✎</button>
              <button class="btn-del-record" title="删除" onclick="window.deleteRecord('${item.id}')">&times;</button>
            </div>
          `;
          container.appendChild(node);
        });
      }

      function initCategoryChips(activeCat) {
        formSelectedCategory = activeCat || "限定";
        const container = document.getElementById('poolCategoryChipsBar');
        container.innerHTML = '';

        CATEGORY_LIST.forEach(cat => {
          const chip = document.createElement('div');
          chip.className = `chip-bubble-opt ${formSelectedCategory === cat ? 'selected' : ''}`;
          chip.innerText = cat;
          chip.onclick = function() {
            formSelectedCategory = cat;
            document.querySelectorAll('.chip-bubble-opt').forEach(el => el.classList.remove('selected'));
            chip.classList.add('selected');
          };
          container.appendChild(chip);
        });
      }

      window.openAddModal = function() {
        document.getElementById('recordModalTitle').innerText = '登记密探招募';
        document.getElementById('editRecordId').value = '';
        document.getElementById('btnRecordSubmit').innerText = '录入密卷';
        document.getElementById('inputCharName').value = '';
        document.getElementById('inputPulls').value = '';
        window.clearAvatarPreview();
        window.selectRarity('绝密');
        window.selectUpState(true);

        const poolGroup = document.getElementById('groupPoolSelect');
        const poolSelect = document.getElementById('inputRecordPool');
        poolSelect.innerHTML = '';

        if (activeTab === 'limited') {
          if (appData.pools.length === 0) {
            alert('请先开辟至少一个限定卡池。');
            window.openCreatePoolModal();
            return;
          }
          poolGroup.style.display = 'block';
          appData.pools.forEach(function(p) {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.innerText = p.name;
            poolSelect.appendChild(opt);
          });
        } else {
          poolGroup.style.display = 'none';
        }

        document.getElementById('recordModal').classList.add('active');
      };

      window.openEditModal = function(id) {
        let record = appData.standard.find(r => r.id === id);
        let isFromStandard = true;
        if (!record) {
          record = appData.limited.find(r => r.id === id);
          isFromStandard = false;
        }
        if (!record) return;

        document.getElementById('recordModalTitle').innerText = '修改招募密卷';
        document.getElementById('editRecordId').value = id;
        document.getElementById('btnRecordSubmit').innerText = '保存更动';
        document.getElementById('inputCharName').value = record.name;
        document.getElementById('inputPulls').value = record.pulls;

        currentAvatarBase64 = record.avatar || '';
        const previewBox = document.getElementById('avatarPreviewBox');
        if (currentAvatarBase64) {
          previewBox.innerHTML = `<img src="${currentAvatarBase64}">`;
          document.getElementById('btnClearAvatar').style.display = 'inline-block';
        } else {
          window.clearAvatarPreview();
        }

        window.selectRarity(record.rarity);
        if (!isFromStandard && record.rarity === '绝密') {
          window.selectUpState(record.isUp);
        }

        const poolGroup = document.getElementById('groupPoolSelect');
        const poolSelect = document.getElementById('inputRecordPool');
        poolSelect.innerHTML = '';

        if (!isFromStandard) {
          poolGroup.style.display = 'block';
          appData.pools.forEach(function(p) {
            const opt = document.createElement('option');
            opt.value = p.name;
            opt.innerText = p.name;
            if (record.poolName === p.name) opt.selected = true;
            poolSelect.appendChild(opt);
          });
        } else {
          poolGroup.style.display = 'none';
        }

        document.getElementById('recordModal').classList.add('active');
      };

      window.submitRecord = function() {
        const editId = document.getElementById('editRecordId').value;
        const name = document.getElementById('inputCharName').value.trim();
        const pulls = parseInt(document.getElementById('inputPulls').value, 10);
        if (!name) return alert('请填入密探名字');
        if (isNaN(pulls) || pulls <= 0) return alert('请填入有效抽数');

        if (editId) {
          let target = appData.standard.find(r => r.id === editId);
          if (target) {
            target.name = name;
            target.pulls = pulls;
            target.rarity = formRarity;
            target.avatar = currentAvatarBase64;
          } else {
            target = appData.limited.find(r => r.id === editId);
            if (target) {
              target.name = name;
              target.pulls = pulls;
              target.rarity = formRarity;
              target.avatar = currentAvatarBase64;
              target.poolName = document.getElementById('inputRecordPool').value;
              target.isUp = formRarity === '绝密' ? formIsUp : false;
              expandedPoolNames.add(target.poolName);
            }
          }
        } else {
          const item = {
            id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
            name: name,
            avatar: currentAvatarBase64 || '', 
            rarity: formRarity,
            pulls: pulls,
            timestamp: Date.now()
          };

          if (activeTab === 'standard') {
            appData.standard.push(item);
          } else {
            item.poolName = document.getElementById('inputRecordPool').value;
            item.isUp = formRarity === '绝密' ? formIsUp : false;
            appData.limited.push(item);
            expandedPoolNames.add(item.poolName);
          }
        }

        saveData();
        window.closeModal('recordModal');
      };

      window.deleteRecord = function(id) {
        if (!confirm('确认删除此条招募记录？')) return;
        if (activeTab === 'standard') {
          appData.standard = appData.standard.filter(r => r.id !== id);
        } else {
          appData.limited = appData.limited.filter(r => r.id !== id);
        }
        saveData();
      };

      window.openCreatePoolModal = function() {
        document.getElementById('poolModalTitle').innerText = '开辟新限定卡池';
        document.getElementById('btnSubmitPoolForm').innerText = '确认创设';
        document.getElementById('editingPoolOriginalName').value = '';

        document.getElementById('newPoolNameInput').value = '';
        document.getElementById('poolStartDateInput').value = '';
        document.getElementById('poolEndDateInput').value = '';
        document.getElementById('newPoolCharsInput').value = '';

        initCategoryChips("限定");
        document.getElementById('createPoolModal').classList.add('active');
      };

      window.openEditPoolModalByName = function(poolName) {
        const pool = appData.pools.find(p => p.name === poolName);
        if (!pool) return;

        document.getElementById('poolModalTitle').innerText = '编辑限定卡池';
        document.getElementById('btnSubmitPoolForm').innerText = '保存更动';
        document.getElementById('editingPoolOriginalName').value = pool.name;

        document.getElementById('newPoolNameInput').value = pool.name;
        document.getElementById('newPoolCharsInput').value = pool.upChars || '';

        if (pool.dateRange && pool.dateRange.includes('-')) {
          const splitArr = pool.dateRange.split('-');
          document.getElementById('poolStartDateInput').value = parseDateToISO(splitArr[0]);
          document.getElementById('poolEndDateInput').value = parseDateToISO(splitArr[1]);
        } else {
          document.getElementById('poolStartDateInput').value = '';
          document.getElementById('poolEndDateInput').value = '';
        }

        initCategoryChips(pool.category || "限定");
        document.getElementById('createPoolModal').classList.add('active');
      };

      window.submitPoolForm = function() {
        const originalName = document.getElementById('editingPoolOriginalName').value;
        const name = document.getElementById('newPoolNameInput').value.trim();
        const startVal = document.getElementById('poolStartDateInput').value;
        const endVal = document.getElementById('poolEndDateInput').value;
        const upChars = document.getElementById('newPoolCharsInput').value.trim() || '未设';
        const category = formSelectedCategory || "限定";

        if (!name) return alert('卡池名录不可为空');

        let dateRangeStr = '未定';
        if (startVal && endVal) {
          dateRangeStr = `${startVal.replace(/-/g, '.')} - ${endVal.replace(/-/g, '.')}`;
        } else if (startVal) {
          dateRangeStr = `${startVal.replace(/-/g, '.')} 起`;
        }

        if (originalName) {
          if (name !== originalName && appData.pools.some(p => p.name === name)) {
            return alert('已存在同名的其他卡池');
          }
          const targetPool = appData.pools.find(p => p.name === originalName);
          if (targetPool) {
            targetPool.name = name;
            targetPool.dateRange = dateRangeStr;
            targetPool.upChars = upChars;
            targetPool.category = category;
          }
          if (name !== originalName) {
            appData.limited.forEach(rec => {
              if (rec.poolName === originalName) rec.poolName = name;
            });
            if (appData.poolBanners[originalName]) {
              appData.poolBanners[name] = appData.poolBanners[originalName];
              delete appData.poolBanners[originalName];
            }
            if (expandedPoolNames.has(originalName)) {
              expandedPoolNames.delete(originalName);
              expandedPoolNames.add(name);
            }
          }
        } else {
          if (appData.pools.some(p => p.name === name)) return alert('已存在同名限定池');
          appData.pools.push({ name, dateRange: dateRangeStr, upChars, category });
          expandedPoolNames.add(name);
        }

        saveData();
        window.closeModal('createPoolModal');
      };

      window.clearCurrentPoolData = function() {
        if (!confirm('确认清空全部密探招募记录吗？（卡池与海报依然保留）')) return;
        if (activeTab === 'standard') {
          appData.standard = [];
        } else {
          appData.limited = [];
        }
        saveData();
      };

      window.selectRarity = function(r) {
        formRarity = r;
        document.getElementById('optSSR').classList.toggle('selected', r === '绝密');
        document.getElementById('optSR').classList.toggle('selected', r === '密探');
        document.getElementById('groupUpSetting').style.display = (activeTab === 'limited' && r === '绝密') ? 'block' : 'none';
      };

      window.selectUpState = function(isUp) {
        formIsUp = isUp;
        document.getElementById('optIsUp').classList.toggle('selected', isUp);
        document.getElementById('optIsLost').classList.toggle('selected', !isUp);
      };

      window.closeModal = function(id) {
        document.getElementById(id).classList.remove('active');
      };

      window.closeModalOnBg = function(e) {
        if (e.target.classList.contains('modal-overlay')) {
          e.target.classList.remove('active');
        }
      };

      window.exportDataJSON = function() {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '代号鸢招募全档案_' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
      };

      window.triggerImportJSON = function() {
        document.getElementById('jsonFileInput').click();
      };

      window.importDataJSON = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const data = JSON.parse(evt.target.result);
            appData = {
              standard: data.standard || [],
              pools: data.pools || [],
              poolBanners: data.poolBanners || {},
              limited: data.limited || []
            };

            if (data.limitedPools && Array.isArray(data.limitedPools)) {
              data.limitedPools.forEach(oldName => {
                const normName = NAME_ALIASES[oldName] || (oldName.endsWith('复刻') ? oldName.replace('复刻', '') : oldName);
                if (!appData.pools.some(p => p.name === normName)) {
                  appData.pools.push({ name: normName, dateRange: '2023.01.01 起', upChars: '未指定', category: "限定" });
                }
              });
            }

            reconcilePools();
            saveData().then(() => alert('全档案数据导入成功！'));
          } catch(err) {
            alert('JSON 文件格式损坏，无法恢复');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      openDatabase().then(loadData).then(render).catch(() => {
        console.error('IndexedDB 启动异常');
      });
    })();
  </script>
</body>
</html>
